<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tidak Ada Koneksi — FBQR Merchant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FAFAF9;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 360px; }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #78716c;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: #E8622A;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #d4521f; }
    .tip {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #a8a29e;
      background: #f5f5f4;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Halaman ini membutuhkan koneksi internet. Periksa koneksi WiFi atau data Anda,
      lalu coba lagi.
    </p>
    <button onclick="window.location.reload()">Coba Lagi</button>
    <div class="tip">
      💡 <strong>Tips:</strong> Untuk menerima notifikasi pesanan di iPhone/iPad,
      tambahkan FBQR ke Layar Utama melalui Safari: Bagikan → Tambah ke Layar Utama.
    </div>
  </div>
</body>
</html>
